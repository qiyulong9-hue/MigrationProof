model:
  model_id: qwen3_5
  model_name_or_path: __HF_MODEL_PATH__
  trust_remote_code: true
  attn_implementation: flash_attention_2
  freeze: [model.visual]
  gdn_implementation: ascendc
  causal_conv1d_implementation: triton
  skip_gdn_recompute: true
  skip_flash_attn_recompute: true
data:
  dataset_param:
    dataset_type: huggingface
    preprocess_parameters:
      model_name_or_path: __HF_MODEL_PATH__
      use_fast_tokenizer: true
      split_special_tokens: false
      image_max_pixels: 262144
      image_min_pixels: 1024
      video_max_pixels: 16384
      video_min_pixels: 0
      video_fps: 2.0
      video_maxlen: 64
    basic_parameters:
      cutoff_len: 1024
      template: qwen3_vl_nothink
      enable_thinking: false
      train_on_prompt: false
      mask_history: false
      dataset_dir: __DATASET_DIR__
      dataset: __DATASET_PATH__
      cache_dir: __CACHE_DIR__
      overwrite_cache: false
      preprocessing_batch_size: 1000
      preprocessing_num_workers: 16
      preprocess_on_fly: true
    attr:
      images: images
      messages: messages
      role_tag: role
      content_tag: content
      user_tag: user
      assistant_tag: assistant
  dataloader_param:
    pin_memory: true
    shuffle: false
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 8
    collate_param:
      model_name: qwen3vl
      ignore_pad_token_for_loss: true
    enable_preload: false
parallel:
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules: [model.visual, 'model.visual.blocks.{*}', model.language_model.embed_tokens, model.language_model, 'model.language_model.layers.{*}', lm_head, mtp]
    param_dtype: bf16
    reduce_dtype: fp32
    num_to_forward_prefetch: 1
    num_to_backward_prefetch: 1
  ulysses_parallel_size: 1
features:
  recompute: true
  recompute_plan:
    apply_modules: ['model.visual.blocks.{*}', 'model.language_model.layers.{*}']
  enable_chunk_loss: true
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 1024
  enable_activation_offload: true
  activation_offload_plan:
    apply_modules: ['model.visual.blocks.{*}', 'model.language_model.layers.{*}']
training:
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  seed: 42
  lr: 1.0e-5
  lr_decay_style: cosine
  lr_warmup_ratio: 0.1
  weight_decay: 0
  train_iters: 100
  clip_grad: 0.0
  init_model_with_meta_device: true
  optimizer: adamw
  adam_fused: true
  save_interval: 100
  no_load_optim: true
  no_load_rng: true
  no_save_optim: true
  no_save_rng: true
  load: __DCP_MODEL_PATH__
  save: __SAVE_PATH__
  use_deter_comp: false
  plugin: [mindspeed_mm/fsdp/models/qwen3_5, mindspeed_mm/fsdp/data/datasets/huggingface]
